name: OBR Harvester Experiment

on:
  push:
    branches:
      - feat/obr-harvester
    paths:
      - "src/tools/obr-harvester.mjs"
      - "src/tools/obr-harvester.test.mjs"
      - "src/tools/obr-mock-smoke.mjs"
      - ".github/workflows/obr-harvester-experiment.yml"
      - "src/packages/obr-smoke-battle-system-com.json"
      - "docs/obr-harvester-experiment.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-static-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test src/tools/obr-harvester.test.mjs

      - name: Harvest Smoke & Spectre production bundle
        run: |
          rm -rf .harvest/smoke
          node src/tools/obr-harvester.mjs \
            https://smoke.battle-system.com/manifest.json \
            --existing src/packages/obr-smoke-battle-system-com.json \
            --out .harvest/smoke \
            --max-assets 300

      - name: Write experiment summary
        shell: bash
        run: |
          echo '## Smoke & Spectre static harvest' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .harvest/smoke/report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Top 40 new medium/high-confidence candidates:' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const x=require("./.harvest/smoke/new-candidates.json"); console.log(x.slice(0,40).map(v=>`[${v.score}] ${v.text}`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload harvest report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-static-harvest
          path: .harvest/smoke/
          if-no-files-found: error
          retention-days: 14

  smoke-mock-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright for experiment
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Smoke in OBR Mock Host
        run: |
          rm -rf .harvest/mock-smoke
          node src/tools/obr-mock-smoke.mjs .harvest/mock-smoke

      - name: Write mock-host summary
        if: always()
        shell: bash
        run: |
          echo '## Smoke & Spectre OBR Mock Host' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .harvest/mock-smoke/mock-report.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r = require('./.harvest/mock-smoke/mock-report.json');
          console.log('```json');
          console.log(JSON.stringify({
            loaded: r.loaded,
            frameUrl: r.frameUrl,
            bodyTextLength: r.bodyTextLength,
            messageCount: r.messageCount,
            messageCounts: r.messageCounts,
            registeredUiCount: r.registeredUi?.length || 0,
            pageErrors: r.pageErrors
          }, null, 2));
          console.log('```');
          console.log('\n### Body text preview\n```text');
          console.log((r.bodyText || '').slice(0, 4000));
          console.log('```');
          NODE
          else
            echo 'mock-report.json was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mock-host report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mock-host
          path: .harvest/mock-smoke/
          if-no-files-found: warn
          retention-days: 14
