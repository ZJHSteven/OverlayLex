name: build-validate

on:
  push:
    branches:
      - main
      - feat/unified-browser-builds
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all targets
        run: npm run build:all

      - name: Validate artifacts and permissions
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/userscript/overlaylex.user.js
          test -f dist/userscript/overlaylex.meta.js
          test -f .output/chrome-mv3/manifest.json
          test -f .output/edge-mv3/manifest.json
          test -f .output/firefox-mv3/manifest.json

          node --check dist/userscript/overlaylex.user.js
          if grep -Fq '"use strict"(function overlayLexBootstrap' dist/userscript/overlaylex.user.js; then
            echo 'UserScript wrapper swallowed the legacy IIFE statement boundary.'
            exit 1
          fi
          grep -Fq ';(function overlayLexBootstrap' dist/userscript/overlaylex.user.js

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const browser of ['chrome', 'edge', 'firefox']) {
            const manifest = JSON.parse(fs.readFileSync(`.output/${browser}-mv3/manifest.json`, 'utf8'));
            const scripts = manifest.content_scripts ?? [];
            if (!scripts.length) throw new Error(`${browser}: missing content_scripts`);
            const overlay = scripts.find((item) => item.all_frames === true);
            if (!overlay) throw new Error(`${browser}: OverlayLex content script is not configured for all frames`);
            if (overlay.matches?.includes('<all_urls>')) throw new Error(`${browser}: store build must not request <all_urls>`);
            if (!overlay.matches?.includes('*://owlbear.rodeo/*')) throw new Error(`${browser}: missing Owlbear host access`);
          }

          const firefox = JSON.parse(fs.readFileSync('.output/firefox-mv3/manifest.json', 'utf8'));
          const gecko = firefox.browser_specific_settings?.gecko;
          if (gecko?.id !== 'overlaylex@zjhstudio.com') throw new Error('firefox: stable extension id missing');
          if (!gecko?.data_collection_permissions?.required?.includes('browsingActivity')) {
            throw new Error('firefox: browsingActivity disclosure missing');
          }
          console.log('Artifact and permission validation passed.');
          NODE

      - name: Package extensions
        run: |
          npm run zip:chrome
          npm run zip:edge
          npm run zip:firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: overlaylex-builds
          if-no-files-found: error
          include-hidden-files: true
          path: |
            dist/userscript/*.js
            .output/*.zip
            .output/*/manifest.json
