name: release-publish

on:
  push:
    branches:
      - feat/unified-browser-builds

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all targets
        run: npm run build:all

      - name: Validate artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/userscript/overlaylex.user.js
          test -f dist/userscript/overlaylex.meta.js
          test -f .output/chrome-mv3/manifest.json
          test -f .output/edge-mv3/manifest.json
          test -f .output/firefox-mv3/manifest.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const browser of ['chrome', 'edge', 'firefox']) {
            const manifest = JSON.parse(fs.readFileSync(`.output/${browser}-mv3/manifest.json`, 'utf8'));
            const scripts = manifest.content_scripts ?? [];
            if (!scripts.length) throw new Error(`${browser}: missing content_scripts`);
            const overlay = scripts.find((item) => item.all_frames === true);
            if (!overlay) throw new Error(`${browser}: no all_frames content script`);
            if (overlay.matches?.includes('<all_urls>')) throw new Error(`${browser}: store build still requests <all_urls>`);
            if (!overlay.matches?.includes('*://owlbear.rodeo/*')) throw new Error(`${browser}: missing Owlbear host access`);
            console.log(browser, JSON.stringify({manifest_version: manifest.manifest_version, matches: overlay.matches, gecko: manifest.browser_specific_settings?.gecko ?? null}));
          }
          NODE

      - name: Package extensions
        run: |
          npm run zip:chrome
          npm run zip:edge
          npm run zip:firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: overlaylex-unified-build-test
          if-no-files-found: error
          include-hidden-files: true
          path: |
            package-lock.json
            dist/userscript/*.js
            .output/*.zip
            .output/*/manifest.json
